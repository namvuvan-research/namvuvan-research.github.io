theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Ho_Chi_Minh

title: Nam Vu
tagline: Application security & AI-assisted security research

description: >-
  Security research, responsible disclosure, and AI-assisted security workflows
  by Nam Vu, a Security Engineer at NTQ and cybersecurity student at Hanoi University of Science and Technology.

url: "https://namvuvan-research.github.io"
baseurl: ""

github:
  username: namvuvan-research

twitter:
  username: vuvannam_sec

social:
  name: Nam Vu
  email: vuvannam.sec@gmail.com
  links:
    - https://github.com/namvuvan-research
    - https://x.com/vuvannam_sec
    - https://www.linkedin.com/in/namvuvan-security

theme_mode: light
avatar: /assets/img/profile-avatar.png
toc: true
comments: false
paginate: 10

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
